services:
  neo4j:
    image: neo4j:5-community
    container_name: geoquad-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/geoquad123
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - geoquad-neo4j-data:/data
      - geoquad-neo4j-logs:/logs
      - ./neo4j/seed:/seed:ro
      - ./neo4j/dev:/dev-seed:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p geoquad123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ./src/GeoQuad.Web
      dockerfile: Dockerfile
    container_name: geoquad-web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__User: neo4j
      Neo4j__Password: geoquad123
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  geoquad-neo4j-data:
  geoquad-neo4j-logs:
