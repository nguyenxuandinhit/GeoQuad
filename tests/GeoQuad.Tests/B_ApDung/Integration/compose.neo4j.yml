services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:17687:7687"
      - "127.0.0.1:17474:7474"
    environment:
      NEO4J_AUTH: neo4j/geoquad_test_123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    labels:
      geoquad.test-isolation: "B-only"
    volumes:
      - b-test-data:/data
      - ../../../../neo4j/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p geoquad_test_123 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
volumes:
  b-test-data:
    labels:
      geoquad.test-isolation: "B-only"
